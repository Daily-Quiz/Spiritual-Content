<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور اليوم - محتوى متجدد</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Reem+Kufi&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fdfaf6; --text: #2c3e50; --accent: #a67c52; }
        body { background: var(--bg); font-family: 'Amiri', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 85%; max-width: 450px; padding: 40px 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border-top: 6px solid var(--accent); }
        .type { font-family: 'Reem Kufi', sans-serif; color: var(--accent); font-size: 1.2rem; margin-bottom: 20px; display: block; }
        .content { font-size: 2.2rem; line-height: 1.6; color: var(--text); margin-bottom: 25px; min-height: 150px; display: flex; align-items: center; justify-content: center; }
        .ref { font-size: 1.1rem; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 15px; }
        .btn { margin-top: 30px; background: var(--accent); color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; font-family: 'Amiri'; font-size: 1.1rem; transition: 0.3s; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="card">
    <span id="type" class="type">جارِ التحميل...</span>
    <div id="content" class="content"></div>
    <div id="ref" class="ref"></div>
    <button class="btn" onclick="showNewContent()">إظهار محتوى آخر</button>
</div>

<script>
    const db = [
        { t: "أية قرآنية", c: "فَاذْكُرُونِي أَذْكُرْكُمْ", r: "البقرة: 152" },
        { t: "حديث شريف", c: "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ", r: "البخاري" },
        { t: "دعاء", c: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", r: "الترمذي" },
        { t: "أية قرآنية", c: "إِنَّ مَعَ الْعُسْرِ يُسْرًا", r: "الشرح: 6" },
        { t: "حديث شريف", c: "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ", r: "الترمذي" }
        // ... (Add your full 180 entries here)
    ];

    function showNewContent() {
        // Get list of seen indexes from phone storage
        let seen = JSON.parse(localStorage.getItem('seenItems')) || [];
        
        // If all items seen, reset the list
        if (seen.length >= db.length) { seen = []; }

        // Find an index not in the 'seen' list
        let availableIndexes = db.map((_, i) => i).filter(i => !seen.includes(i));
        let randomIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];

        // Save this index as seen
        seen.push(randomIndex);
        localStorage.setItem('seenItems', JSON.stringify(seen));

        // Display
        const item = db[randomIndex];
        document.getElementById('type').innerText = item.t;
        document.getElementById('content').innerText = item.c;
        document.getElementById('ref').innerText = item.r;
    }

    window.onload = showNewContent;
</script>
</body>
</html>
