<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور اليوم - الأربعون النووية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fdfaf6; --text: #2c3e50; --accent: #a67c52; --accent-light: #e6dcd2; }
        body { background: var(--bg); font-family: 'Amiri', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; width: 100%; max-width: 550px; padding: 40px 25px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; border-top: 10px solid var(--accent); transition: 0.3s; }
        .type { font-family: 'Reem Kufi', sans-serif; color: var(--accent); font-size: 1.3rem; margin-bottom: 20px; display: block; }
        .content { font-size: 2.2rem; line-height: 1.7; color: var(--text); margin-bottom: 25px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .shrah-text { font-size: 1.3rem; color: #555; background: var(--bg); padding: 15px; border-radius: 15px; margin-top: 15px; display: none; text-align: justify; border-right: 4px solid var(--accent); }
        .ref { font-size: 1.1rem; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 15px; margin-top: 20px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-family: 'Amiri'; font-size: 1.2rem; transition: 0.3s; width: 100%; }
        .btn-shrah { background: var(--accent-light); color: var(--accent); font-weight: bold; display: none; }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="card">
    <span id="type" class="type"></span>
    <div class="content">
        <div id="main-text"></div>
        <div id="shrah-box" class="shrah-text"></div>
    </div>
    <div id="ref" class="ref"></div>

    <div class="btn-group">
        <button id="shrah-btn" class="btn btn-shrah" onclick="toggleShrah()">شرح الحديث</button>
        <button class="btn" onclick="loadNew()">محتوى جديد</button>
    </div>
</div>

<script>
    const db = [
        // --- DAYS 1-40: AL-ARBA'IN AN-NAWAWIYYA ---
        { t: "الحديث الأول (الأربعون النووية)", c: "إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى...", r: "رواه البخاري ومسلم", s: "هذا الحديث أصل عظيم في الدين، فمدار قبول الأعمال على إخلاص النية لله تعالى وحده." },
        { t: "الحديث الثاني (الأربعون النووية)", c: "بينما نحن جلوس عند رسول الله صلى الله عليه وسلم إذ طلع علينا رجل شديد بياض الثياب...", r: "رواه مسلم", s: "يعرف هذا بحديث جبريل، وفيه بيان مراتب الدين الثلاثة: الإسلام، والإيمان، والإحسان." },
        { t: "الحديث الثالث (الأربعون النووية)", c: "بني الإسلام على خمس: شهادة أن لا إله إلا الله...", r: "رواه البخاري ومسلم", s: "يشرح الحديث أركان الإسلام الخمسة التي يقوم عليها بناء الدين الصالـح." },
        // ... Continue adding up to 40 Nawawi Hadiths with "s" property for Shrah ...

        // --- REST OF THE DAYS: QURAN & DUA ---
        { t: "آية قرآنية", c: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", r: "الرعد: 28" },
        { t: "دعاء", c: "اللهم إني أسألك الهدى والتقى والعفاف والغنى", r: "رواه مسلم" }
    ];

    let currentItem = null;

    function loadNew() {
        let seen = JSON.parse(localStorage.getItem('seen_spiritual_v2')) || [];
        if (seen.length >= db.length) seen = [];

        let remaining = db.map((_, i) => i).filter(i => !seen.includes(i));
        let randomIndex = remaining[Math.floor(Math.random() * remaining.length)];

        seen.push(randomIndex);
        localStorage.setItem('seen_spiritual_v2', JSON.stringify(seen));

        currentItem = db[randomIndex];
        display(currentItem);
    }

    function display(item) {
        document.getElementById('type').innerText = item.t;
        document.getElementById('main-text').innerText = item.c;
        document.getElementById('ref').innerText = item.r;
        
        const shrahBox = document.getElementById('shrah-box');
        const shrahBtn = document.getElementById('shrah-btn');
        
        shrahBox.style.display = 'none';
        shrahBox.innerText = item.s || "";

        // Only show "Shrah" button if the item has a shrah property
        if (item.s) {
            shrahBtn.style.display = 'block';
        } else {
            shrahBtn.style.display = 'none';
        }
    }

    function toggleShrah() {
        const box = document.getElementById('shrah-box');
        box.style.display = (box.style.display === 'none' || box.style.display === '') ? 'block' : 'none';
    }

    window.onload = loadNew;
</script>
</body>
</html>
