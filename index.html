<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور اليوم - الأربعون النووية كاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f9f7f2; --text: #2c3e50; --accent: #8e735b; --white: #ffffff; }
        body { background: var(--bg); font-family: 'Amiri', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; box-sizing: border-box; }
        .card { background: var(--white); width: 100%; max-width: 650px; padding: 35px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.06); border: 1px solid #e0dcd5; text-align: center; display: flex; flex-direction: column; }
        .title { font-family: 'Aref Ruqaa', serif; color: var(--accent); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 12px; }
        .hadith-scroll { max-height: 50vh; overflow-y: auto; padding: 0 15px; margin-bottom: 20px; text-align: justify; border-radius: 10px; background: #fffcf9; }
        .hadith-text { font-size: 1.6rem; line-height: 1.9; color: var(--text); font-weight: 700; white-space: pre-line; }
        .shrah-box { display: none; background: #f1ede4; padding: 20px; border-radius: 15px; font-size: 1.25rem; color: #444; line-height: 1.7; margin-top: 15px; text-align: right; border-right: 6px solid var(--accent); animation: fadeIn 0.4s; }
        .ref { font-size: 1.1rem; color: #7f8c8d; margin-top: 15px; font-weight: 400; }
        .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }
        .btn { border: none; padding: 16px; border-radius: 50px; cursor: pointer; font-family: 'Amiri'; font-size: 1.2rem; transition: 0.3s; width: 100%; font-weight: 700; }
        .btn-main { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(142, 115, 91, 0.2); }
        .btn-shrah { background: #e0dcd5; color: var(--accent); }
        .btn:active { transform: scale(0.97); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hadith-scroll::-webkit-scrollbar { width: 5px; }
        .hadith-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div id="title" class="title">جارِ التحميل...</div>
    <div class="hadith-scroll">
        <div id="hadith" class="hadith-text"></div>
    </div>
    <div id="shrah" class="shrah-box"></div>
    <div id="ref" class="ref"></div>

    <div class="btns">
        <button id="btn-shrah" class="btn btn-shrah" onclick="toggleShrah()">إظهار شرح الحديث</button>
        <button class="btn btn-main" onclick="nextItem()">عرض حديث آخر (بدون تكرار)</button>
    </div>
</div>

<script>
    const db = [
        { t: "الحديث الأول", c: "عَنْ أَمِيرِ المُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ».", r: "رواه البخاري ومسلم", s: "النية هي أساس قبول العمل، وصلاحه بصلاحها." },
        { t: "الحديث الثاني", c: "عَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ أَيْضًا قَالَ: بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللهِ ﷺ ذَاتَ يَوْمٍ... قَالَ: فَأَخْبِرْنِي عَنِ الإِحْسَانِ؟ قَالَ: «أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ»...", r: "رواه مسلم", s: "يشرح مراتب الدين: الإسلام، الإيمان، والإحسان." },
        { t: "الحديث الثالث", c: "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللهِ بْنِ عُمَرَ بْنِ الخَطَّابِ رَضِيَ اللهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ البَيْتِ، وَصَوْمِ رَمَضَانَ».", r: "رواه البخاري ومسلم", s: "أركان الإسلام الخمسة التي يقوم عليها الدين." },
        { t: "الحديث الرابع", c: "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللهِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: حَدَّثَنَا رَسُولُ اللهِ ﷺ وَهُوَ الصَّادِقُ المَصْدُوقُ: «إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً...»", r: "رواه البخاري ومسلم", s: "بيان أطوار خلق الإنسان وكتابة رزقه وأجله." },
        { t: "الحديث الخامس", c: "عَنْ أُمِّ المُؤْمِنِينَ أُمِّ عَبْدِ اللهِ عَائِشَةَ رَضِيَ اللهُ قَالَتْ: قَالَ رَسُولُ اللهِ ﷺ: «مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ».", r: "رواه البخاري ومسلم", s: "وجوب اتباع السنة ورفض البدع في الدين." },
        { t: "الحديث السادس", c: "عَنِ النُّعْمَانِ بْنِ بَشِيرٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّ الحَلَالَ بَيِّنٌ وَإِنَّ الحَرَامَ بَيِّنٌ...»", r: "رواه البخاري ومسلم", s: "الحث على اتقاء الشبهات صيانة للدين والورع." },
        { t: "الحديث السابع", c: "عَنْ تَمِيمِ بْنِ أَوْسٍ الدَّارِيِّ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ قَالَ: «الدِّينُ النَّصِيحَةُ». قُلْنَا: لِمَنْ؟ قَالَ: «لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ المُسْلِمِينَ وَعَامَّتِهِمْ».", r: "رواه مسلم", s: "النصيحة هي عماد الدين وقوامه." },
        { t: "الحديث الثامن", c: "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إِلَهَ إِلَّا اللهُ...»", r: "رواه البخاري ومسلم", s: "عصمة دم المسلم بكلمة التوحيد وأداء الفرائض." },
        { t: "الحديث التاسع", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ...»", r: "رواه البخاري ومسلم", s: "التيسير في الأوامر والحزم في اجتناب النواهي." },
        { t: "الحديث العاشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ اللهَ طَيِّبٌ لَا يَقْبَلُ إِلَّا طَيِّبًا...»", r: "رواه مسلم", s: "أثر أكل الحلال في استجابة الدعاء وقبول العمل." },
        { t: "الحديث الحادي عشر", c: "عَنْ أَبِي مُحَمَّدٍ الحَسَنِ بْنِ عَلِيٍّ رَضِيَ اللهُ عَنْهُمَا قَالَ: حَفِظْتُ مِنْ رَسُولِ اللهِ ﷺ: «دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ».", r: "رواه الترمذي والنسائي", s: "ترك المشكوك فيه والاطمئنان لليقين." },
        { t: "الحديث الثاني عشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مِنْ حُسْنِ إِسْلَامِ المَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ».", r: "رواه الترمذي", s: "الاشتغال بما ينفع في الدنيا والآخرة." },
        { t: "الحديث الثالث عشر", c: "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ ﷺ قَالَ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ».", r: "رواه البخاري ومسلم", s: "المحبة والمواساة بين المسلمين من كمال الإيمان." },
        { t: "الحديث الرابع عشر", c: "عَنِ ابْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ المُفَارِقُ لِلْجَمَاعَةِ».", r: "رواه البخاري ومسلم", s: "حرمة دم المسلم إلا في الحالات الشرعية المحددة." },
        { t: "الحديث الخامس عشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ...»", r: "رواه البخاري ومسلم", s: "آداب الكلام وإكرام الجار والضيف." },
        { t: "الحديث السادس عشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ ﷺ: أَوْصِنِي. قَالَ: «لَا تَغْضَبْ». فَرَدَّدَ مِرَارًا، قَالَ: «لَا تَغْضَبْ».", r: "رواه البخاري", s: "الغضب جماع الشر، والسيطرة عليه مفتاح كل خير." },
        { t: "الحديث السابع عشر", c: "عَنْ أَبِي يَعْلَى شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللهِ ﷺ قَالَ: «إِنَّ اللهَ كَتَبَ الإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا القِتْلَةَ...»", r: "رواه مسلم", s: "وجوب الإحسان والرحمة في كل فعل، حتى عند الذبح." },
        { t: "الحديث الثامن عشر", c: "عَنْ أَبِي ذَرٍّ وَمُعَاذِ بْنِ جَبَلٍ رَضِيَ اللهُ عَنْهُمَا عَنْ رَسُولِ اللهِ ﷺ قَالَ: «اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ».", r: "رواه الترمذي", s: "التقوى ومحو الذنوب بالحسنات وحسن الخلق." },
        { t: "الحديث التاسع عشر", c: "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: كُنْتُ خَلْفَ النَّبِيِّ ﷺ يَوْمًا فَقَالَ: «يَا غُلَامُ، إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللهَ يَحْفَظْكَ...»", r: "رواه الترمذي", s: "الاستعانة بالله والتوكل عليه والإيمان بالقدر." },
        { t: "الحديث العشرون", c: "عَنْ أَبِي مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الأُولَى: إِذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْتَ».", r: "رواه البخاري", s: "الحياء مانع من الوقوع في القبائح والمنكرات." },
        { t: "الحديث الحادي والعشرون", c: "عَنْ أَبِي عَمْرٍو سُفْيَانَ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللهِ، قُلْ لِي فِي الإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ. قَالَ: «قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ».", r: "رواه مسلم", s: "الاستقامة بعد الإيمان هي جوهر الدين." },
        { t: "الحديث الثاني والعشرون", c: "عَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَجُلًا سَأَلَ رَسُولَ اللهِ ﷺ فَقَالَ: أَرَأَيْتَ إِذَا صَلَّيْتُ المَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الحَلَالَ، وَحَرَّمْتُ الحَرَامَ، وَلَمْ أَزِدْ عَلَى ذَلِكَ شَيْئًا، أَأَدْخُلُ الجَنَّةَ؟ قَالَ: «نَعَمْ».", r: "رواه مسلم", s: "الفلاح والنجاة في الالتزام بالفرائض واجتناب المحرمات." },
        { t: "الحديث الثالث والعشرون", c: "عَنْ أَبِي مَالِكٍ الحَارِثِ بْنِ عَاصِمٍ الأَشْعَرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «الطُّهُورُ شَطْرُ الإِيمَانِ، وَالحَمْدُ لِلَّهِ تَمْلأُ المِيزَانَ... وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ...»", r: "رواه مسلم", s: "بيان فضائل الأعمال الصالحة والذكر والصبر." },
        { t: "الحديث الرابع والعشرون", c: "عَنْ أَبِي ذَرٍّ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ ﷺ فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى أَنَّهُ قَالَ: «يَا عِبَادِي، إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا فَلَا تَظَالَمُوا...»", r: "رواه مسلم", s: "تحريم الظلم ودعوة العباد للاستغفار وطلب الرزق والهدى من الله." },
        { t: "الحديث الخامس والعشرون", c: "عَنْ أَبِي ذَرٍّ رَضِيَ اللهُ عَنْهُ أَيْضًا أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللهِ ﷺ قَالُوا لِلنَّبِيِّ ﷺ: يَا رَسُولَ اللهِ ذَهَبَ أَهْلُ الدُّثُورِ بِالأُجُورِ... قَالَ: «أَوَلَيْسَ قَدْ جَعَلَ اللهُ لَكُمْ مَا تَصَّدَّقُونَ؟ إِنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً...»", r: "رواه مسلم", s: "وجوه الخير والصدقة كثيرة وليست محصورة في المال." },
        { t: "الحديث السادس والعشرون", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «كُلُّ سُلَامَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ: تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ...»", r: "رواه البخاري ومسلم", s: "شكر نعم الله في الأعضاء من خلال الأعمال الصالحة." },
        { t: "الحديث السابع والعشرون", c: "عَنِ النَّوَّاسِ بْنِ سَمْعَانَ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ ﷺ قَالَ: «البِرُّ حُسْنُ الخُلُقِ، وَالإِثْمُ مَا حَاكَ فِي نَفْسِكَ وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ».", r: "رواه مسلم", s: "البر والإثم وميزان الضمير في معرفة الحق." },
        { t: "الحديث الثامن والعشرون", c: "عَنْ أَبِي نَجِيحٍ العِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللهُ عَنْهُ قَالَ: وَعَظَنَا رَسُولُ اللهِ ﷺ مَوْعِظَةً وَجِلَتْ مِنْهَا القُلُوبُ وَذَرَفَتْ مِنْهَا العُيُونُ... فَقَالَ: «أُوصِيكُمْ بِتَقْوَى اللهِ، وَالسَّمْعِ وَالطَّاعَةِ...»", r: "رواه أبو داود والترمذي", s: "الوصية بالتقوى والطاعة ولزوم السنة عند الاختلاف." },
        { t: "الحديث التاسع والعشرون", c: "عَنْ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللهِ، أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الجَنَّةَ وَيُبَاعِدُنِي عَنِ النَّارِ؟ قَالَ: «لَقَدْ سَأَلْتَ عَنْ عَظِيمٍ... تَعْبُدُ اللهَ لَا تُشْرِكُ بِهِ شَيْئًا... أَلَا أُخْبِرُكَ بِمَلَاكِ ذَلِكَ كُلِّهِ؟» كَفَّ عَلَيْكَ هَذَا (وأشار بلسانه).", r: "رواه الترمذي", s: "أبواب الخير الكبرى وأهمية حفظ اللسان." },
        { t: "الحديث الثلاثون", c: "عَنْ أَبِي ثَعْلَبَةَ الخُشَنِيِّ رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللهِ ﷺ قَالَ: «إِنَّ اللهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا...»", r: "رواه الدارقطني وغيره", s: "حدود الله وفرائضه وحرماته التي لا يجوز تجاوزها." },
        { t: "الحديث الحادي والثلاثون", c: "عَنْ أَبِي العَبَّاسِ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إِلَى النَّبِيِّ ﷺ فَقَالَ: يَا رَسُولَ اللهِ، دُلَّنِي عَلَى عَمَلٍ إِذَا عَمِلْتُهُ أَحَبَّنِيَ اللهُ وَأَحَبَّنِيَ النَّاسُ. فَقَالَ: «ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ».", r: "رواه ابن ماجه", s: "الزهد في الدنيا وفيما بأيدي الناس طريق لنيل المحبة." },
        { t: "الحديث الثاني والثلاثون", c: "عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «لَا ضَرَرَ وَلَا ضِرَارَ».", r: "رواه ابن ماجه والدارقطني", s: "قاعدة فقهية كبرى في تحريم الإضرار بالنفس أو بالغير." },
        { t: "الحديث الثالث والثلاثون", c: "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «لَوْ يُعْطَى النَّاسُ بِدَعْوَاهُمْ لَادَّعَى رِجَالٌ أَمْوَالَ قَوْمٍ وَدِمَاءَهُمْ، وَلَكِنَّ البَيِّنَةَ عَلَى المُدَّعِي، وَاليَمِينَ عَلَى مَنْ أَنْكَرَ».", r: "رواه البيهقي", s: "أساس القضاء والشهادة في الإسلام لحماية الحقوق." },
        { t: "الحديث الرابع والثلاثون", c: "عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الإِيمَانِ».", r: "رواه مسلم", s: "وجوب إنكار المنكر بحسب الاستطاعة وبحسب المراتب." },
        { t: "الحديث الخامس والثلاثون", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا... كُونُوا عِبَادَ اللهِ إِخْوَانًا... المُسْلِمُ أَخُو المُسْلِمِ لَا يَظْلِمُهُ وَلَا يَخْذُلُهُ...»", r: "رواه مسلم", s: "آداب الأخوة الإسلامية والتحذير من أمراض القلوب." },
        { t: "الحديث السادس والثلاثون", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ ﷺ قَالَ: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ القِيَامَةِ... وَاللهُ فِي عَوْنِ العَبْدِ مَا كَانَ العَبْدُ فِي عَوْنِ أَخِيهِ...»", r: "رواه مسلم", s: "فضل قضاء حوائج المسلمين وسترهم ونشر العلم." },
        { t: "الحديث السابع والثلاثون", c: "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا عَنْ رَسُولِ اللهِ ﷺ فِيمَا يَرْوِي عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى قَالَ: «إِنَّ اللهَ كَتَبَ الحَسَنَاتِ وَالسَّيِّئَاتِ ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللهُ عِنْدَهُ حَسَنَةً كَامِلَةً...»", r: "رواه البخاري ومسلم", s: "سعة رحمة الله وفضله في كتابة الحسنات ومضاعفتها." },
        { t: "الحديث الثامن والثلاثون", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ اللهَ تَعَالَى قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالحَرْبِ، وَمَا تَقَرَّبَ إِلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إِلَيَّ مِمَّا افْتَرَضْتُ عَلَيْهِ...»", r: "رواه البخاري", s: "التقرب إلى الله بالفرائض ثم النوافل وبغض من عادى أولياء الله." },
        { t: "الحديث التاسع والثلاثون", c: "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «إِنَّ اللهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ».", r: "رواه ابن ماجه والبيهقي", s: "بيان سعة عفو الله في حالة الخطأ والنسيان والإكراه." },
        { t: "الحديث الأربعون", c: "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا قَالَ: أَخَذَ رَسُولُ اللهِ ﷺ بِمَنْكِبِي فَقَالَ: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ».", r: "رواه البخاري", s: "الزهد في الدنيا والتهيئة لدار الآخرة." },
        { t: "الحديث الحادي والأربعون", c: "عَنْ أَبِي مُحَمَّدٍ عَبْدِ اللهِ بْنِ عَمْرِو بْنِ العَاصِ رَضِيَ اللهُ عَنْهُمَا قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعًا لِمَا جِئْتُ بِهِ».", r: "حديث حسن صححه النووي", s: "وجوب إخضاع هوى النفس لما جاء به الشرع." },
        { t: "الحديث الثاني والأربعون", c: "عَنْ أَنَسٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «قَالَ اللهُ تَعَالَى: يَا ابْنَ آدَمَ، إِنَّكَ مَا دَعَوْتَنِي وَرَجَوْتَنِي غَفَرْتُ لَكَ عَلَى مَا كَانَ مِنْكَ وَلَا أُبَالِي...»", r: "رواه الترمذي", s: "سعة مغفرة الله وفضله في قبول توبة العباد مهما كبرت ذنوبهم." }
    ];

    function nextItem() {
        let seen = JSON.parse(localStorage.getItem('nawawi_full_v4')) || [];
        if (seen.length >= db.length) {
            alert("تم إكمال جميع الأحاديث! سيتم البدء من جديد.");
            seen = [];
        }

        let remaining = db.map((_, i) => i).filter(i => !seen.includes(i));
        let randomIndex = remaining[Math.floor(Math.random() * remaining.length)];

        seen.push(randomIndex);
        localStorage.setItem('nawawi_full_v4', JSON.stringify(seen));

        display(db[randomIndex]);
    }

    function display(item) {
        document.getElementById('title').innerText = item.t;
        document.getElementById('hadith').innerText = item.c;
        document.getElementById('ref').innerText = item.r;
        document.getElementById('shrah').innerText = item.s;
        document.getElementById('shrah').style.display = 'none';
        document.getElementById('btn-shrah').innerText = "إظهار شرح الحديث";
        document.querySelector('.hadith-scroll').scrollTop = 0;
    }

    function toggleShrah() {
        const box = document.getElementById('shrah');
        const btn = document.getElementById('btn-shrah');
        if (box.style.display === 'none') {
            box.style.display = 'block';
            btn.innerText = "إخفاء الشرح";
        } else {
            box.style.display = 'none';
            btn.innerText = "إظهار شرح الحديث";
        }
    }

    window.onload = nextItem;
</script>
</body>
</html>
