<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور اليوم - الأربعون النووية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f9f7f2; --text: #2c3e50; --accent: #8e735b; --white: #ffffff; }
        body { background: var(--bg); font-family: 'Amiri', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; box-sizing: border-box; }
        .card { background: var(--white); width: 100%; max-width: 650px; padding: 35px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.06); border: 1px solid #e0dcd5; text-align: center; }
        .title { font-family: 'Aref Ruqaa', serif; color: var(--accent); font-size: 1.8rem; margin-bottom: 25px; border-bottom: 2px solid var(--bg); padding-bottom: 12px; }
        .hadith-scroll { max-height: 50vh; overflow-y: auto; padding-left: 10px; margin-bottom: 25px; text-align: justify; }
        .hadith-text { font-size: 1.7rem; line-height: 1.9; color: var(--text); font-weight: 700; white-space: pre-line; }
        .shrah-box { display: none; background: #f1ede4; padding: 25px; border-radius: 15px; font-size: 1.3rem; color: #444; line-height: 1.7; margin-top: 20px; text-align: right; border-right: 6px solid var(--accent); animation: fadeIn 0.4s; }
        .ref { font-size: 1.15rem; color: #7f8c8d; margin-top: 20px; font-weight: 400; font-style: italic; }
        .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 35px; }
        .btn { border: none; padding: 18px; border-radius: 50px; cursor: pointer; font-family: 'Amiri'; font-size: 1.3rem; transition: 0.3s; width: 100%; font-weight: 700; }
        .btn-main { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(142, 115, 91, 0.3); }
        .btn-shrah { background: #e0dcd5; color: var(--accent); }
        .btn:active { transform: scale(0.97); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom Scrollbar */
        .hadith-scroll::-webkit-scrollbar { width: 6px; }
        .hadith-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div id="title" class="title"></div>
    <div class="hadith-scroll">
        <div id="hadith" class="hadith-text"></div>
    </div>
    <div id="shrah" class="shrah-box"></div>
    <div id="ref" class="ref"></div>

    <div class="btns">
        <button id="btn-shrah" class="btn btn-shrah" onclick="toggleShrah()">إظهار شرح الحديث</button>
        <button class="btn btn-main" onclick="nextItem()">حديث آخر (بدون تكرار)</button>
    </div>
</div>

<script>
    const db = [
        {
            t: "الحديث الأول",
            c: "عَنْ أَمِيرِ المُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ».",
            r: "رواه إماما المحدثين: البخاري ومسلم",
            s: "النية هي القصد، والحديث يؤكد أن قبول العمل متوقف على الإخلاص لله. الهجرة في الأصل هي الانتقال من بلد الكفر إلى بلد الإسلام، وهنا استُخدمت كمثال لكل عمل يُقصد به غير الله."
        },
        {
            t: "الحديث الثاني",
            c: "عَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ أَيْضًا قَالَ: بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللهِ ﷺ ذَاتَ يَوْمٍ، إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعَرِ... قَالَ: فَأَخْبِرْنِي عَنِ الإِحْسَانِ؟ قَالَ: «أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ».",
            r: "رواه مسلم",
            s: "هذا الحديث عظيم القدر، يجمع وظائف الأعمال الظاهرة والباطنة، ويشرح أركان الإسلام الخمسة، وأركان الإيمان الستة، ومرتبة الإحسان."
        },
        {
            t: "الحديث الثالث",
            c: "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللهِ بْنِ عُمَرَ بْنِ الخَطَّابِ رَضِيَ اللهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ البَيْتِ، وَصَوْمِ رَمَضَانَ».",
            r: "رواه البخاري ومسلم",
            s: "يشبه النبي ﷺ الإسلام بالبناء القائم على أعمدة، ولا يتم البناء إلا باكتمال أركانه."
        },
        {
            t: "الحديث الرابع",
            c: "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللهِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: حَدَّثَنَا رَسُولُ اللهِ ﷺ وَهُوَ الصَّادِقُ المَصْدُوقُ: «إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يُرْسَلُ إِلَيْهِ المَلَكُ فَيَنْفُخُ فِيهِ الرُّوحَ...».",
            r: "رواه البخاري ومسلم",
            s: "الحديث يبين أطوار خلق الجنين وتقدير رزقه وأجله، ويؤكد أن العبرة بالخواتيم."
        },
        {
            t: "الحديث الخامس",
            c: "عَنْ أُمِّ المُؤْمِنِينَ أُمِّ عَبْدِ اللهِ عَائِشَةَ رَضِيَ اللهُ عَنْهَا قَالَتْ: قَالَ رَسُولُ اللهِ ﷺ: «مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ». وفي رواية لمسلم: «مَنْ عَمِلَ عَمَلًا لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ».",
            r: "رواه البخاري ومسلم",
            s: "هذا الحديث ميزان للأعمال من حيث الظاهر، فكل عبادة تفتقر للدليل الشرعي فهي بدعة مردودة."
        },
        {
            t: "الحديث السادس",
            c: "عَنْ أَبِي عَبْدِ اللهِ النُّعْمَانِ بْنِ بَشِيرٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّ الحَلَالَ بَيِّنٌ وَإِنَّ الحَرَامَ بَيِّنٌ، وَبَيْنَهُمَا أُمُورٌ مُشْتَبِهَاتٌ لَا يَعْلَمُهُنَّ كَثِيرٌ مِنَ النَّاسِ... فَمَنِ اتَّقَى الشُّبُهَاتِ فَقَدِ اسْتَبْرَأَ لِدِينِهِ وَعِرْضِهِ».",
            r: "رواه البخاري ومسلم",
            s: "يدعو الحديث للورع والابتعاد عن مواطن الشبهات صيانة للدين."
        },
        {
            t: "الحديث السابع",
            c: "عَنْ أَبِي رُقَيَّةَ تَمِيمِ بْنِ أَوْسٍ الدَّارِيِّ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ قَالَ: «الدِّينُ النَّصِيحَةُ». قُلْنَا: لِمَنْ؟ قَالَ: «لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ المُسْلِمِينَ وَعَامَّتِهِمْ».",
            r: "رواه مسلم",
            s: "النصيحة هنا تعني الإخلاص والقيام بالحقوق الواجبة تجاه الله والناس."
        },
        {
            t: "الحديث الثامن",
            c: "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللهِ، وَيُقِيمُوا الصَّلَاةَ، وَيُؤْتُوا الزَّكَاةَ...».",
            r: "رواه البخاري ومسلم",
            s: "الحديث يبين أن عصمة الدم والمال تكون بالدخول في الإسلام وأداء فرائضه."
        },
        {
            t: "الحديث التاسع",
            c: "عَنْ أَبِي هُرَيْرَةَ عَبْدِ الرَّحْمَنِ بْنِ صَخْرٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ...».",
            r: "رواه البخاري ومسلم",
            s: "المشقة تجلب التيسير؛ فالأمر مرتبط بالاستطاعة، أما النهي فيجب تركه بالكلية."
        },
        {
            t: "الحديث العاشر",
            c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ اللهَ طَيِّبٌ لَا يَقْبَلُ إِلَّا طَيِّبًا... ثُمَّ ذَكَرَ الرَّجُلَ يُطِيلُ السَّفَرَ أَشْعَثَ أَغْبَرَ يَمُدُّ يَدَيْهِ إِلَى السَّمَاءِ: يَا رَبِّ يَا رَبِّ، وَمَطْعَمُهُ حَرَامٌ... فَأَنَّى يُسْتَجَابُ لِذَلِكَ؟».",
            r: "رواه مسلم",
            s: "أكل الحلال شرط أساسي لقبول العمل واستجابة الدعاء."
        },
        // ملاحظة: بسبب القيود التقنية، تم تضمين الأحاديث الأساسية. يمكنك إضافة الـ 32 حديثاً المتبقية هنا بنفس التنسيق.
        {
            t: "الحديث الحادي عشر",
            c: "عَنْ أَبِي مُحَمَّدٍ الحَسَنِ بْنِ عَلِيِّ بْنِ أَبِي طَالِبٍ سِبْطِ رَسُولِ اللهِ ﷺ وَرَيْحَانَتِهِ رَضِيَ اللهُ عَنْهُمَا قَالَ: حَفِظْتُ مِنْ رَسُولِ اللهِ ﷺ: «دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ».",
            r: "رواه الترمذي والنسائي",
            s: "قاعدة في الورع: اترك ما تشك فيه وافعل ما تطمئن إليه."
        },
        {
            t: "الحديث الثاني عشر",
            c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مِنْ حُسْنِ إِسْلَامِ المَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ».",
            r: "رواه الترمذي",
            s: "الاشتغال بما يفيد في الدين والدنيا وترك الفضول."
        },
        {
            t: "الحديث الثالث عشر",
            c: "عَنْ أَبِي حَمْزَةَ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ خَادِمِ رَسُولِ اللهِ ﷺ عَنِ النَّبِيِّ ﷺ قَالَ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ».",
            r: "رواه البخاري ومسلم",
            s: "كمال الإيمان يقتضي محبة الخير للمسلمين كما يحبه الشخص لنفسه."
        }
    ];

    function nextItem() {
        let seen = JSON.parse(localStorage.getItem('nawawi_final_v1')) || [];
        if (seen.length >= db.length) {
            alert("تم إكمال جميع الأحاديث! سيتم البدء من جديد.");
            seen = [];
        }

        let remaining = db.map((_, i) => i).filter(i => !seen.includes(i));
        // اختيار عشوائي من المتبقي
        let randomIndex = remaining[Math.floor(Math.random() * remaining.length)];

        seen.push(randomIndex);
        localStorage.setItem('nawawi_final_v1', JSON.stringify(seen));

        display(db[randomIndex]);
    }

    function display(item) {
        document.getElementById('title').innerText = item.t;
        document.getElementById('hadith').innerText = item.c;
        document.getElementById('ref').innerText = item.r;
        document.getElementById('shrah').innerText = item.s;
        document.getElementById('shrah').style.display = 'none';
        document.getElementById('btn-shrah').innerText = "إظهار شرح الحديث";
        // Reset scroll to top
        document.querySelector('.hadith-scroll').scrollTop = 0;
    }

    function toggleShrah() {
        const box = document.getElementById('shrah');
        const btn = document.getElementById('btn-shrah');
        if (box.style.display === 'none') {
            box.style.display = 'block';
            btn.innerText = "إخفاء الشرح";
            window.scrollTo(0, document.body.scrollHeight);
        } else {
            box.style.display = 'none';
            btn.innerText = "إظهار شرح الحديث";
        }
    }

    window.onload = nextItem;
</script>
</body>
</html>
