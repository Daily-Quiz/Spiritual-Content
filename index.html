<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور اليوم - الأربعون النووية بالترتيب</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f9f7f2; --text: #2c3e50; --accent: #8e735b; --white: #ffffff; }
        body { background: var(--bg); font-family: 'Amiri', serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; box-sizing: border-box; }
        .card { background: var(--white); width: 100%; max-width: 650px; padding: 35px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.06); border: 1px solid #e0dcd5; text-align: center; }
        .title { font-family: 'Aref Ruqaa', serif; color: var(--accent); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 12px; }
        .hadith-scroll { max-height: 45vh; overflow-y: auto; padding: 0 15px; margin-bottom: 20px; text-align: justify; background: #fffcf9; border-radius: 10px; }
        .hadith-text { font-size: 1.6rem; line-height: 1.9; color: var(--text); font-weight: 700; white-space: pre-line; }
        .shrah-box { display: none; background: #f1ede4; padding: 20px; border-radius: 15px; font-size: 1.25rem; color: #444; line-height: 1.7; margin-top: 15px; text-align: right; border-right: 6px solid var(--accent); }
        .ref { font-size: 1.1rem; color: #7f8c8d; margin-top: 15px; }
        .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }
        .btn { border: none; padding: 16px; border-radius: 50px; cursor: pointer; font-family: 'Amiri'; font-size: 1.2rem; transition: 0.3s; width: 100%; font-weight: 700; }
        .btn-main { background: var(--accent); color: white; }
        .btn-shrah { background: #e0dcd5; color: var(--accent); }
        .btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="card">
    <div id="title" class="title">تحميل...</div>
    <div class="hadith-scroll">
        <div id="hadith" class="hadith-text"></div>
    </div>
    <div id="shrah" class="shrah-box"></div>
    <div id="ref" class="ref"></div>

    <div class="btns">
        <button id="btn-shrah" class="btn btn-shrah" onclick="toggleShrah()">إظهار شرح الحديث</button>
        <button class="btn btn-main" onclick="processNext()">الحديث التالي (بالترتيب)</button>
    </div>
</div>

<script>
    const db = [
        { t: "الحديث الأول", c: "عَنْ أَمِيرِ المُؤْمِنِينَ أَبِي حَفْصٍ عُمَرَ بْنِ الخَطَّابِ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى، فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللهِ وَرَسُولِهِ، وَمَنْ كَانَتْ هِجْرَتُهُ لِدُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَنْكِحُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ».", r: "رواه البخاري ومسلم", s: "الأعمال بالنيات: أي قبول العمل وصحته مرتبطان بنية العبد وإخلاصه لله." },
        { t: "الحديث الثاني", c: "عَنْ عُمَرَ رَضِيَ اللهُ عَنْهُ أَيْضًا قَالَ: بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللهِ ﷺ ذَاتَ يَوْمٍ... قَالَ: فَأَخْبِرْنِي عَنِ الإِحْسَانِ؟ قَالَ: «أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ»...", r: "رواه مسلم", s: "مراتب الدين: الإسلام (الأعمال الظاهرة)، الإيمان (الاعتقاد الباطن)، الإحسان (المراقبة)." },
        { t: "الحديث الثالث", c: "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللهِ بْنِ عُمَرَ بْنِ الخَطَّابِ رَضِيَ اللهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللهِ، وَإِقَامِ الصَّلَاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ البَيْتِ، وَصَوْمِ رَمَضَانَ».", r: "رواه البخاري ومسلم", s: "أركان الإسلام: هي القواعد الخمس التي يقوم عليها هذا الدين العظيم." },
        { t: "الحديث الرابع", c: "عَنْ أَبِي عَبْدِ الرَّحْمَنِ عَبْدِ اللهِ بْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: حَدَّثَنَا رَسُولُ اللهِ ﷺ وَهُوَ الصَّادِقُ المَصْدُوقُ: «إِنَّ أَحَدَكُمْ يُجْمَعُ خَلْقُهُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ يَوْمًا نُطْفَةً...»", r: "رواه البخاري ومسلم", s: "خلق الإنسان: بيان أطوار الجنين وتقدير الرزق والأجل والعمل وهو في بطن أمه." },
        { t: "الحديث الخامس", c: "عَنْ أُمِّ المُؤْمِنِينَ أُمِّ عَبْدِ اللهِ عَائِشَةَ رَضِيَ اللهُ قَالَتْ: قَالَ رَسُولُ اللهِ ﷺ: «مَنْ أَحْدَثَ فِي أَمْرِنَا هَذَا مَا لَيْسَ مِنْهُ فَهُوَ رَدٌّ».", r: "رواه البخاري ومسلم", s: "اتباع السنة: كل عمل أو عبادة لا تستند للشرع فهي مردودة على صاحبها." },
        { t: "الحديث السادس", c: "عَنِ النُّعْمَانِ بْنِ بَشِيرٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «إِنَّ الحَلَالَ بَيِّنٌ وَإِنَّ الحَرَامَ بَيِّنٌ...»", r: "رواه البخاري ومسلم", s: "اتقاء الشبهات: الابتعاد عن الأمور المشكوك فيها صيانة للدين والعرض." },
        { t: "الحديث السابع", c: "عَنْ تَمِيمِ بْنِ أَوْسٍ الدَّارِيِّ رَضِيَ اللهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ قَالَ: «الدِّينُ النَّصِيحَةُ». قُلْنَا: لِمَنْ؟ قَالَ: «لِلَّهِ، وَلِكِتَابِهِ، وَلِرَسُولِهِ، وَلِأَئِمَّةِ المُسْلِمِينَ وَعَامَّتِهِمْ».", r: "رواه مسلم", s: "النصيحة هي عماد الدين: وتعني الإخلاص في العمل لله والصدق مع الناس." },
        { t: "الحديث الثامن", c: "عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لَا إِلَهَ إِلَّا اللهُ...»", r: "رواه البخاري ومسلم", s: "حرمة المسلم: تترتب بمجرد النطق بالشهادتين وإقامة الصلاة وإيتاء الزكاة." },
        { t: "الحديث التاسع", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «مَا نَهَيْتُكُمْ عَنْهُ فَاجْتَنِبُوهُ، وَمَا أَمَرْتُكُمْ بِهِ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ...»", r: "رواه البخاري ومسلم", s: "التيسير: ترك المنهيات واجب، وفعل الأوامر مرتبط بالاستطاعة." },
        { t: "الحديث العاشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ اللهَ طَيِّبٌ لَا يقبَلُ إِلَّا طَيِّبًا...»", r: "رواه مسلم", s: "أكل الحلال: شرط أساسي لقبول العمل واستجابة الدعاء." },
        { t: "الحديث الحادي عشر", c: "عَنْ أَبِي مُحَمَّدٍ الحَسَنِ بْنِ عَلِيٍّ رَضِيَ اللهُ عَنْهُمَا قَالَ: حَفِظْتُ مِنْ رَسُولِ اللهِ ﷺ: «دَعْ مَا يَرِيبُكَ إِلَى مَا لَا يَرِيبُكَ».", r: "رواه الترمذي والنسائي", s: "الورع: ترك المشكوك فيه وفعل اليقين الذي يطمئن له القلب." },
        { t: "الحديث الثاني عشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مِنْ حُسْنِ إِسْلَامِ المَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ».", r: "رواه الترمذي", s: "الاشتغال بالمفيد: ترك الفضول وما لا ينفع في الدين والدنيا." },
        { t: "الحديث الثالث عشر", c: "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ ﷺ قَالَ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ».", r: "رواه البخاري ومسلم", s: "كمال الإيمان: محبة الخير للمسلمين كما يحبه الإنسان لنفسه." },
        { t: "الحديث الرابع عشر", c: "عَنِ ابْنِ مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا يَحِلُّ دَمُ امْرِئٍ مُسْلِمٍ إِلَّا بِإِحْدَى ثَلَاثٍ: الثَّيِّبُ الزَّانِي، وَالنَّفْسُ بِالنَّفْسِ، وَالتَّارِكُ لِدِينِهِ المُفَارِقُ لِلْجَمَاعَةِ».", r: "رواه البخاري ومسلم", s: "حرمة الدم: التأكيد على عظمة دم المسلم إلا في حدود شرعية قاسية." },
        { t: "الحديث الخامس عشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَاليَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ...»", r: "رواه البخاري ومسلم", s: "آداب الإيمان: حفظ اللسان وإكرام الجار وإكرام الضيف." },
        { t: "الحديث السادس عشر", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ أَنَّ رَجُلًا قَالَ لِلنَّبِيِّ ﷺ: أَوْصِنِي. قَالَ: «لَا تَغْضَبْ». فَرَدَّدَ مِرَارًا، قَالَ: «لَا تَغْضَبْ».", r: "رواه البخاري", s: "ضبط النفس: الغضب مفسدة للأخلاق والعلاقات والوصية النبوية هي تركه." },
        { t: "الحديث السابع عشر", c: "عَنْ أَبِي يَعْلَى شَدَّادِ بْنِ أَوْسٍ رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللهِ ﷺ قَالَ: «إِنَّ اللهَ كَتَبَ الإِحْسَانَ عَلَى كُلِّ شَيْءٍ، فَإِذَا قَتَلْتُمْ فَأَحْسِنُوا القِتْلَةَ...»", r: "رواه مسلم", s: "الإحسان الشامل: حتى في القتل والذبح، يجب أن تظهر رحمة المسلم." },
        { t: "الحديث الثامن عشر", c: "عَنْ أَبِي ذَرٍّ وَمُعَاذِ بْنِ جَبَلٍ رَضِيَ اللهُ عَنْهُمَا عَنْ رَسُولِ اللهِ ﷺ قَالَ: «اتَّقِ اللهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الحَسَنَةَ تَمْحُهَا، وَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ».", r: "رواه الترمذي", s: "العلاقة مع الله والناس: التقوى في السر، وتصحيح الخطأ بالحسنة، وحسن التعامل." },
        { t: "الحديث التاسع عشر", c: "عَنِ ابْنِ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا قَالَ: كُنْتُ خَلْفَ النَّبِيِّ ﷺ يَوْمًا فَقَالَ: «يَا غُلَامُ، إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللهَ يَحْفَظْكَ...»", r: "رواه الترمذي", s: "التوحيد والقدر: الاستعانة بالله وحده والرضا بقضائه وقدره." },
        { t: "الحديث العشرون", c: "عَنْ أَبِي مَسْعُودٍ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «إِنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الأُولَى: إِذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْتَ».", r: "رواه البخاري", s: "أهمية الحياء: إذا فقد الإنسان الحياء سقط في الرذائل ولم يبالِ بالخلق." },
        { t: "الحديث الحادي والعشرون", c: "عَنْ أَبِي عَمْرٍو سُفْيَانَ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْتُ: يَا رَسُولَ اللهِ، قُلْ لِي فِي الإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَكَ. قَالَ: «قُلْ: آمَنْتُ بِاللَّهِ، ثُمَّ اسْتَقِمْ».", r: "رواه مسلم", s: "الاستقامة: هي لزوم طاعة الله والعمل بمقتضى الإيمان حتى الموت." },
        { t: "الحديث الثاني والعشرون", c: "عَنْ جَابِرِ بْنِ عَبْدِ اللهِ رَضِيَ اللهُ عَنْهُمَا أَنَّ رَسُلًا سأل رَسُولَ اللهِ ﷺ فَقَالَ: أَرَأَيْتَ إِذَا صَلَّيْتُ المَكْتُوبَاتِ، وَصُمْتُ رَمَضَانَ، وَأَحْلَلْتُ الحَلَالَ، وَحَرَّمْتُ الحَرَامَ... أأدخل الجنة؟ قال: نعم.", r: "رواه مسلم", s: "أساسيات الفلاح: أداء الواجبات وترك المحرمات طريق الجنة." },
        { t: "الحديث الثالث والعشرون", c: "عَنْ أَبِي مَالِكٍ الحَارِثِ بْنِ عَاصِمٍ الأَشْعَرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «الطُّهُورُ شَطْرُ الإِيمَانِ، وَالحَمْدُ لِلَّهِ تَمْلأُ المِيزَانَ...»", r: "رواه مسلم", s: "فضائل الذكر: الطهارة والحمد والتسبيح والصلاة أسلحة المسلم." },
        { t: "الحديث الرابع والعشرون", c: "عَنْ أَبِي ذَرٍّ رَضِيَ اللهُ عَنْهُ عَنِ النَّبِيِّ ﷺ فِيمَا يَرْوِيهِ عَنْ رَبِّهِ: «يَا عِبَادِي، إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا فَلَا تَظَالَمُوا...»", r: "رواه مسلم", s: "تحريم الظلم: بيان افتقار العباد لفضل الله وغناه سبحانه عنهم." },
        { t: "الحديث الخامس والعشرون", c: "عَنْ أَبِي ذَرٍّ أَيْضًا أَنَّ نَاسًا قَالَوا: يَا رَسُولَ اللهِ ذَهَبَ أَهْلُ الدُّثُورِ بِالأُجُورِ... قَالَ: «أَوَلَيْسَ قَدْ جَعَلَ اللهُ لَكُمْ مَا تَصَّدَّقُونَ؟»", r: "رواه مسلم", s: "الصدقة المعنوية: كل تسبيحة وتحميدة وذِكر هو صدقة لمن لا يملك المال." },
        { t: "الحديث السادس والعشرون", c: "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «كُلُّ سُلَامَى مِنَ النَّاسِ عَلَيْهِ صَدَقَةٌ... تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ...»", r: "رواه البخاري ومسلم", s: "شكر الأعضاء: مساعدة الناس وإماطة الأذى عن الطريق هي صدقات الجوارح." },
        { t: "الحديث السابع والعشرون", c: "عَنِ النَّوَّاسِ بْنِ سَمْعَانَ عَنِ النَّبِيِّ ﷺ قَالَ: «البِرُّ حُسْنُ الخُلُقِ، وَالإِثْمُ مَا حَاكَ فِي نَفْسِكَ وَكَرِهْتَ أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ».", r: "رواه مسلم", s: "ميزان البر والإثم: الصدر يضيق بالذنب ويرتاح للعمل الصالح." },
        { t: "الحديث الثامن والعشرون", c: "عَنِ العِرْبَاضِ بْنِ سَارِيَةَ قَالَ: وَعَظَنَا رَسُولُ اللهِ ﷺ مَوْعِظَةً... قَالَ: «أُوصِيكُمْ بِتَقْوَى اللهِ، وَالسَّمْعِ وَالطَّاعَةِ...»", r: "رواه أبو داود", s: "لزوم السنة: الالتزام بمنهج النبي ﷺ والخلفاء الراشدين وقت الفتن." },
        { t: "الحديث التاسع والعشرون", c: "عَنْ مُعَاذِ بْنِ جَبَلٍ قَالَ: قُلْتُ يَا رَسُولَ اللهِ أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الجَنَّةَ... قَالَ: «تَعْبُدُ اللهَ لَا تُشْرِكُ بِهِ شَيْئًا... كُفَّ عَلَيْكَ هَذَا (اللسان)».", r: "رواه الترمذي", s: "أبواب الخير: الصلاة والصيام والصدقة، ولكن حصائد الألسنة قد تفسد كل ذلك." },
        { t: "الحديث الثلاثون", c: "عَنْ أَبِي ثَعْلَبَةَ الخُشَنِيِّ قَالَ: «إِنَّ اللهَ فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا...»", r: "رواه الدارقطني", s: "الوقوف عند الحدود: احترام فرائض الله وعدم تجاوز ما حرّم." },
        { t: "الحديث الحادي والثلاثون", c: "عَنْ سَهْلِ بْنِ سَعْدٍ قَالَ: جَاءَ رَجُلٌ فَقَالَ: يَا رَسُولَ اللهِ دُلَّنِي عَلَى عَمَلٍ يُحِبَّنِي اللهُ... قَالَ: «ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللهُ».", r: "رواه ابن ماجه", s: "الزهد: هو عدم التعلق بالدنيا والتركيز على ما ينفع في الآخرة." },
        { t: "الحديث الثاني والثلاثون", c: "عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «لَا ضَرَرَ وَلَا ضِرَارَ».", r: "رواه ابن ماجه", s: "القاعدة الذهبية: يُمنع في الإسلام الإضرار بالنفس أو بالآخرين بكل أشكاله." },
        { t: "الحديث الثالث والثلاثون", c: "عَنِ ابْنِ عَبَّاسٍ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «البَيِّنَةُ عَلَى المُدَّعِي، وَاليَمِينَ عَلَى مَنْ أَنْكَرَ».", r: "رواه البيهقي", s: "العدل في القضاء: حفظ حقوق الناس من الادعاءات الباطلة." },
        { t: "الحديث الرابع والثلاثون", c: "عَنْ أَبِي سَعِيدٍ الخُدْرِيِّ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ...»", r: "رواه مسلم", s: "تغيير المنكر: مسؤولية اجتماعية تتم باليد أو اللسان أو القلب حسب القدرة." },
        { t: "الحديث الخامس والثلاثون", c: "عَنْ أَبِي هُرَيْرَةَ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا... وَكُونُوا عِبَادَ اللهِ إِخْوَانًا».", r: "رواه مسلم", s: "الأخوة الإيمانية: تطهير القلب من الحسد والبغض والظلم." },
        { t: "الحديث السادس والثلاثون", c: "عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ ﷺ قَالَ: «مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً... نَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ القِيَامَةِ».", r: "رواه مسلم", s: "التكافل: جزاء الإحسان للناس من جنس العمل في الدنيا والآخرة." },
        { t: "الحديث السابع والثلاثون", c: "عَنِ ابْنِ عَبَّاسٍ قَالَ: «إِنَّ اللهَ كَتَبَ الحَسَنَاتِ وَالسَّيِّئَاتِ... فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللهُ حَسَنَةً كَامِلَةً».", r: "رواه البخاري ومسلم", s: "سعة الفضل: فضل الله واسع في مضاعفة الحسنات وعدم مضاعفة السيئات." },
        { t: "الحديث الثامن والثلاثون", c: "عَنْ أَبِي هُرَيْرَةَ قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «مَنْ عَادَى لِي وَلِيًّا فَقَدْ آذَنْتُهُ بِالحَرْبِ...»", r: "رواه البخاري", s: "الولاية: القرب من الله بأداء الفرائض ثم النوافل يحقق معية الله." },
        { t: "الحديث التاسع والثلاثون", c: "عَنِ ابْنِ عَبَّاسٍ أَنَّ رَسُولَ اللهِ ﷺ قَالَ: «إِنَّ اللهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ».", r: "رواه ابن ماجه", s: "رحمة الله بالأمة: العفو عن الأخطاء غير المتعمدة أو ما كان بالإكراه." },
        { t: "الحديث الأربعون", c: "عَنِ ابْنِ عُمَرَ قَالَ: أَخَذَ رَسُولُ اللهِ ﷺ بِمَنْكِبِي فَقَالَ: «كُنْ فِي الدُّنْيَا كَأَنَّكَ غَرِيبٌ أَوْ عَابِرُ سَبِيلٍ».", r: "رواه البخاري", s: "الاستعداد للرحيل: الدنيا ممر وليست مستقراً، فاعمل لآخرتك." },
        { t: "الحديث الحادي والأربعون", c: "عَنْ عَبْدِ اللهِ بْنِ عَمْرٍو قَالَ: قَالَ رَسُولُ اللهِ ﷺ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يَكُونَ هَوَاهُ تَبَعًا لِمَا جِئْتُ بِهِ».", r: "حديث حسن", s: "الانقياد للشرع: كمال الإيمان في ميل قلب الإنسان لما يحبه الله ورسوله." },
        { t: "الحديث الثاني والأربعون", c: "عَنْ أَنَسٍ قَالَ: سَمِعْتُ رَسُولَ اللهِ ﷺ يَقُولُ: «قَالَ اللهُ تَعَالَى: يَا ابْنَ آدَمَ، إِنَّكَ مَا دَعَوْتَنِي وَرَجَوْتَنِي غَفَرْتُ لَكَ...»", r: "رواه الترمذي", s: "سعة المغفرة: باب التوبة مفتوح مهما عظمت الذنوب مع الرجاء والدعاء." }
    ];

    // Order Counter Logic
    let currentIndex = parseInt(localStorage.getItem('nawawi_order_index')) || 0;

    function processCurrent() {
        if (currentIndex >= db.length) {
            currentIndex = 0; // Restart if finished
        }
        display(db[currentIndex]);
    }

    function processNext() {
        currentIndex++;
        if (currentIndex >= db.length) currentIndex = 0;
        localStorage.setItem('nawawi_order_index', currentIndex);
        display(db[currentIndex]);
    }

    function display(item) {
        document.getElementById('title').innerText = item.t;
        document.getElementById('hadith').innerText = item.c;
        document.getElementById('ref').innerText = item.r;
        document.getElementById('shrah').innerText = item.s;
        document.getElementById('shrah').style.display = 'none';
        document.getElementById('btn-shrah').innerText = "إظهار شرح الحديث";
        document.querySelector('.hadith-scroll').scrollTop = 0;
    }

    function toggleShrah() {
        const box = document.getElementById('shrah');
        const btn = document.getElementById('btn-shrah');
        if (box.style.display === 'none') {
            box.style.display = 'block';
            btn.innerText = "إخفاء الشرح";
        } else {
            box.style.display = 'none';
            btn.innerText = "إظهار شرح الحديث";
        }
    }

    window.onload = processCurrent;
</script>
</body>
</html>
