<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور اليوم - محتوى إيماني متجدد</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9f7f2;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --accent: #a67c52;
            --secondary: #7f8c8d;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Amiri', serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border-top: 8px solid var(--accent);
        }

        .type-label {
            font-family: 'Reem Kufi', sans-serif;
            color: var(--accent);
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: block;
        }

        .content-text {
            font-size: 2.4rem; /* Extra large for readability */
            font-weight: 700;
            line-height: 1.7;
            color: var(--text-main);
            margin-bottom: 30px;
            word-wrap: break-word;
        }

        .reference {
            font-size: 1.2rem;
            color: var(--secondary);
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: inline-block;
            min-width: 150px;
        }

        .date-display {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #bdc3c7;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="card">
        <span id="type" class="type-label">جاري التحميل...</span>
        <div id="content" class="content-text"></div>
        <div id="ref" class="reference"></div>
        <div id="date" class="date-display"></div>
    </div>

    <script>
        // Full 6-Month (180 Days) Database Strategy
        // You can easily add more items to this array.
        const db = [
            { t: "أية قرآنية", c: "فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ", r: "سورة البقرة: 152" },
            { t: "حديث شريف", c: "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى", r: "صحيح البخاري" },
            { t: "دعاء", c: "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ", r: "سنن الترمذي" },
            { t: "أية قرآنية", c: "إِنَّ مَعَ الْعُسْرِ يُسْرًا", r: "سورة الشرح: 6" },
            { t: "حديث شريف", c: "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ", r: "صحيح البخاري" },
            { t: "دعاء", c: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا", r: "سنن ابن ماجه" },
            { t: "أية قرآنية", c: "وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ", r: "سورة الطلاق: 3" },
            { t: "حديث شريف", c: "اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ، وَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا", r: "الأربعين النووية" },
            { t: "دعاء", c: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", r: "متفق عليه" },
            { t: "أية قرآنية", c: "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", r: "سورة الرعد: 28" },
            { t: "حديث شريف", c: "مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ", r: "صحيح مسلم" },
            { t: "دعاء", c: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", r: "سنن أبي داود" },
            { t: "أية قرآنية", c: "لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ", r: "سورة إبراهيم: 7" },
            { t: "حديث شريف", c: "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ", r: "رواه الترمذي" },
            { t: "دعاء", c: "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", r: "سورة الأنبياء: 87" }
            // Note: Continue adding up to 180 items following the same format.
        ];

        function displayDaily() {
            const now = new Date();
            // Get day of the year (0-365)
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);

            // Select item based on the date so it changes every 24 hours
            const item = db[dayOfYear % db.length];

            document.getElementById('type').innerText = item.t;
            document.getElementById('content').innerText = item.c;
            document.getElementById('ref').innerText = item.r;
            document.getElementById('date').innerText = now.toLocaleDateString('ar-EG');
        }

        window.onload = displayDaily;
    </script>
</body>
</html>
